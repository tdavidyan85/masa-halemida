# Build and test on every push to main and every pull request to main.
# Tests only – this workflow does not deploy anything (GitHub Pages still deploys from the branch).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash          # bash -eo pipefail: any failing command fails the step
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install exact versions from package-lock.json
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # run-all.js exits 1 if any test fails, so the job fails; the full output is also kept as a log file
      - name: Test
        run: npm test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Keep the log and screenshots when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/test-output.log
            src/*.png
          if-no-files-found: ignore
          retention-days: 14
