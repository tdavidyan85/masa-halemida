# Build and test on every push to main and every pull request to main.
# Tests only – this workflow does not deploy anything (GitHub Pages still deploys from the branch).
name: CI

on:
  push:
    branches: [main, 'feature/**']   # development branches are tested too (tests only, never deployed)
  pull_request:
    branches: [main]
  workflow_dispatch:       # run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash          # bash -eo pipefail: any failing command fails the step
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install exact versions from package-lock.json
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # the files GitHub Pages serves must be exactly what the build makes from src/
      # (catches a forgotten `npm run publish-site`, a hand-edited site file, or two copies of a pack that drifted apart)
      - name: Site files match the build
        run: |
          fail=0
          same() {  # same <built or source file> <file in the site> <what to do if they differ>
            if cmp -s "$1" "$2"; then echo "✓ ${2#../} matches src/$1"
            else echo "::error file=${2#../}::${2#../} differs from src/$1 – $3"; fail=1; fi
          }
          fix="run 'npm run publish-site' in src/ and commit"
          same deploy/index.min.html ../math/index.html "$fix"
          same deploy/english.min.html ../english/index.html "$fix"
          same deploy/root.html ../index.html "copy src/deploy/root.html to index.html and commit"
          for f in ../packs/*.json; do same "packs/$(basename "$f")" "$f" "keep the two copies of the pack the same"; done
          exit $fail

      # every content pack must load and make questions in the real engine;
      # tools/validate-pack.js needs Playwright, which is installed in src/node_modules
      - name: Validate content packs
        run: |
          for f in ../packs/*.json; do
            echo "== ${f#../}"
            NODE_PATH="$PWD/node_modules" node ../tools/validate-pack.js "$f"
          done

      # run-all.js exits 1 if any test fails, so the job fails; the full output is also kept as a log file
      - name: Test
        run: npm test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Keep the log and screenshots when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/test-output.log
            src/*.png
          if-no-files-found: ignore
          retention-days: 14

  # The user portal (portal/): type check, unit + screen tests, production build. Nothing is published.
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # Vitest 5 needs Node >= 22.12
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Type check and build
        run: npm run build

  # Database migrations + RLS security tests on a throwaway PostgreSQL started inside the job
  # (embedded-postgres). No Supabase project, no secrets, no network database.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24          # the tests import the Edge Functions' .ts files (Node type stripping)
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      - name: Migrations, RLS and Edge Function logic tests
        run: npm test

  # A REAL local Supabase inside the job (Auth, REST, Storage, Edge Runtime, Mailpit), then RLS, learning,
  # materials, Edge Function logic and end-to-end tests against it. Nothing in the cloud, no secrets:
  # the stack's keys are the CLI's public local-development keys. Versions are pinned by supabase/supabase.lock.
  # The CLI picks Docker on GitHub's runners (installed there); on a developer Mac without Docker it uses its
  # native runtime (same commands). Tests only – never deploys.
  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      - name: Start local Supabase (applies every migration)
        run: npm run local:start
      - name: Integration tests against it
        run: npm run test:local
      - name: Stop
        if: always()
        run: npm run local:stop
