<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מסע הלמידה</title>
<meta name="description" content="משחקי תרגול לבית הספר, עם הקראה בקול. בלי הרשמה.">
<meta property="og:title" content="מסע הלמידה">
<meta property="og:description" content="משחקי תרגול לבית הספר, עם הקראה בקול. בלי הרשמה.">
<meta property="og:image" content="https://tdavidyan85.github.io/masa-halemida/og.png">
<meta property="og:url" content="https://tdavidyan85.github.io/masa-halemida/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap">
<style>
:root{--paper:#eaf1f8;--grid:#d3e0ee;--card:#fff;--ink:#1b2a4a;--muted:#5b6b8a;--accent:#ff7a1a;--hl:#fff0a3;--sun:#ffd84d;
  --f-display:'Secular One','Varela Round',Arial,sans-serif;--f-body:'Varela Round',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
main{max-width:900px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand{font-family:var(--f-display);font-size:32px;flex:1}
.chip{background:var(--card);border:2px solid #c5d4e6;border-radius:99px;padding:4px 14px;font-size:20px}
.hero{display:flex;gap:20px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:20px 24px;box-shadow:6px 6px 0 var(--ink);flex-wrap:wrap}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:36px;margin:0;line-height:1.2}
.hero p{margin:6px 0 0;color:var(--muted)}
.say{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-size:24px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:26px 0 10px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.subj{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:22px 16px;box-shadow:5px 5px 0 var(--ink);transition:transform .1s;text-align:center}
.subj:hover{transform:translateY(-3px)}
.subj .ic{width:90px;height:90px;border-radius:24px;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:38px;direction:ltr}
.subj .nm{font-family:var(--f-display);font-size:28px}
.subj .st{font-size:16px;color:var(--muted)}
.subj.soon{opacity:.55;box-shadow:none;border-style:dashed;cursor:default}
.subj.soon:hover{transform:none}
.subj.now{box-shadow:0 0 0 5px var(--sun),5px 5px 0 var(--ink)}
footer{text-align:center;margin-top:28px;font-size:16px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">מסע הלמידה</div><div class="chip">⭐ <b id="stars">0</b></div></div>
  <section class="hero">
    <div id="owl"></div>
    <div style="flex:1;min-width:220px"><h1 id="hello">היי! מה נתרגל היום?</h1><p>בוחרים מקצוע. כל שאלה אפשר לשמוע בקול.</p></div>
    <button class="say" id="sayBtn" aria-label="להקריא">🔊</button>
  </section>
  <h2>המקצועות</h2>
  <div class="subjects">
    <a class="subj" href="math/" data-say="חשבון, כיתה ה"><div class="ic" style="background:#ffe0c4">×÷</div><span class="nm">חשבון</span><span class="st" id="st-math">כיתה ה׳ · שיעורים, תרגול ו-8 מבחנים</span></a>
    <a class="subj" href="english/" data-say="אנגלית. שמות גוף"><div class="ic" style="background:#cfe3ff">ABC</div><span class="nm">אנגלית</span><span class="st">שמות גוף · שיעורים, תרגול ו-6 מבחנים</span></a>
    <div class="subj soon" data-say="הבנת הנקרא. בקרוב"><div class="ic" style="background:#d6f3e4">א״ב</div><span class="nm">הבנת הנקרא</span><span class="st">בקרוב</span></div>
  </div>
  <footer><a href="about.html">להורים ולמורים · פרטיות</a></footer>
</main>
<script>
/*OWL*/
let ST={};try{ST=JSON.parse(localStorage.getItem('mj-state')||'{}')||{}}catch(e){}
const kid=(ST.settings&&ST.settings.kidName||'').replace(/[<>&"]/g,'');
document.getElementById('stars').textContent=ST.stars||0;
document.getElementById('owl').innerHTML=owlSVG(110);
if(kid)document.getElementById('hello').textContent=`היי ${kid}! מה נתרגל היום?`;
const n=Object.values(ST.genStats||{}).reduce((a,x)=>a+(x.n||0),0);
if(n)document.getElementById('st-math').textContent=`כיתה ה׳ · כבר ענית על ${n} שאלות`;
let sess=null;try{sess=JSON.parse(localStorage.getItem('mj-session-math')||localStorage.getItem('mj-session')||'null')}catch(e){}
if(sess&&sess.idx<sess.items.length)document.querySelector('a[href="math/"]').classList.add('now');
let sessE=null;try{sessE=JSON.parse(localStorage.getItem('mj-session-english')||'null')}catch(e){}
if(sessE&&sessE.idx<sessE.items.length)document.querySelector('a[href="english/"]').classList.add('now');
/* speech: Hebrew voice if the browser has one */
let voices=[];const lv=()=>{try{voices=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang))}catch(e){}};lv();try{speechSynthesis.onvoiceschanged=lv}catch(e){}
function say(t){if(!voices.length)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.voice=voices.find(v=>/online|natural/i.test(v.name))||voices[0];u.rate=(ST.settings&&ST.settings.rate)||.9;speechSynthesis.speak(u)}catch(e){}}
document.getElementById('sayBtn').onclick=()=>say(document.getElementById('hello').textContent+' בוחרים מקצוע.');
let ht=null;document.querySelectorAll('[data-say]').forEach(el=>{el.addEventListener('mouseenter',()=>{clearTimeout(ht);ht=setTimeout(()=>say(el.dataset.say),450)});el.addEventListener('mouseleave',()=>clearTimeout(ht))});
</script>
</body>
</html>
