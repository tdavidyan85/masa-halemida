<title>מסע הלמידה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#7cc4ff"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap">
<style>
/* Layout: one centered play column on a graph-paper desk; question card + notebook page stacked */
:root{
  --paper:#eaf1f8; --grid:#d3e0ee; --card:#ffffff; --ink:#1b2a4a; --muted:#5b6b8a;
  --accent:#ff7a1a; --accent-dk:#d95f00; --sun:#ffd84d; --fill:#ffad42;
  --good:#138a5c; --good-bg:#daf4e8; --bad:#c9353d; --bad-bg:#fde4e5;
  --line:#c5d4e6; --hl:#fff0a3; --note:#fffdf4; --note-line:#bcd3ea; --margin:#f2a3a3;
  --f-display:'Secular One','Varela Round',Arial,sans-serif;
  --f-body:'Varela Round',Arial,sans-serif;
  color-scheme:light;
}
/* reading options (parents corner): bigger text, airy spacing, plain font. Screen only. */
@media screen{
  html[data-rd-big="1"] body{font-size:24px}
  html[data-rd-big="1"] .opt,html[data-rd-big="1"] .key{font-size:1.15em}
  html[data-rd-space="1"] body{line-height:1.9;letter-spacing:.03em;word-spacing:.12em}
  html[data-rd-plain="1"]{--f-display:Arial,'Segoe UI',sans-serif;--f-body:Arial,'Segoe UI',sans-serif}
  html[data-rd-plain="1"] h1,html[data-rd-plain="1"] h2,html[data-rd-plain="1"] h3{font-weight:700}
}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:var(--f-body);font-size:20px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100%;
}
*{box-sizing:border-box}
#app{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-size:.92em}
.fr .fn{padding:0 .2em}
.fr .fd{border-top:2.5px solid currentColor;padding:0 .2em}
.mx{display:inline-flex;align-items:center;gap:.05em;direction:ltr}
.blank{display:inline-block;width:1.8em;height:1.2em;border:3px dashed var(--accent);border-radius:8px;vertical-align:middle;background:var(--hl)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--f-display);font-size:30px;letter-spacing:.5px;flex:1;min-width:0}
.brand .subj{font-family:var(--f-body);font-size:16px;background:var(--hl);border:2px solid var(--ink);border-radius:99px;padding:0 10px;vertical-align:middle;margin-inline-start:6px}
.brand small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-inline-start:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:20px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.mtx{display:none}}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-size:18px}
.iconbtn:hover{border-color:var(--accent)}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:22px;box-shadow:6px 6px 0 var(--ink)}
.hero h1{font-family:var(--f-display);font-size:34px;margin:0 0 6px;text-wrap:balance;font-weight:400}
.hero p{margin:0 0 14px;color:var(--muted)}
.big{background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:18px;font-family:var(--f-display);font-size:28px;padding:12px 30px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.big:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.big.sec{background:var(--card);color:var(--ink)}
.big.green{background:var(--good)}
.days{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.dayswrap{margin-top:4px}.dayscap{font-size:15px;color:var(--muted)}
.day{min-width:58px;height:54px;border-radius:12px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--muted);line-height:1.2;padding:0 6px}
.day b{font-size:18px}
.day.done{border:2px solid var(--good);background:var(--good-bg);color:var(--good)}
.day.today{border-color:var(--accent);border-style:solid}
h2.sec-t{font-family:var(--f-display);font-weight:400;font-size:26px;margin:26px 0 10px}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.world{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;text-align:right;display:flex;flex-direction:column;gap:8px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.world:hover{transform:translateY(-2px)}
.glyph{font-family:var(--f-display);font-size:30px;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;border:3px solid var(--ink);direction:ltr}
.world .nm{font-family:var(--f-display);font-size:23px}
.bar{height:12px;background:var(--paper);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.world .meta{font-size:15px;color:var(--muted)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:17px}

/* play */
.prog{display:flex;gap:6px;margin-bottom:12px}
.prog i{flex:1;height:12px;border-radius:99px;background:var(--card);border:2px solid var(--line)}
.prog i.ok{background:var(--good);border-color:var(--good)}
.prog i.no{background:var(--fill);border-color:var(--fill)}
.prog i.cur{border-color:var(--accent);background:var(--hl)}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:22px;box-shadow:6px 6px 0 var(--ink)}
.qtag{display:inline-block;font-size:15px;background:var(--paper);border-radius:99px;padding:2px 12px;color:var(--muted);margin-bottom:8px}
.qhead{display:flex;gap:14px;align-items:flex-start}
.say{flex:0 0 auto;width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-size:28px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.say.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.qtext{font-size:28px;line-height:1.75;flex:1;min-width:0;padding-top:6px}
.w{border-radius:8px;cursor:pointer;transition:background .12s,box-shadow .12s}
.w:hover{background:var(--paper)}
.w.now{background:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.tip-read{font-size:15px;color:var(--muted);margin-top:4px}
.visual{margin:16px 0 4px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px;overflow-x:auto}
.visual svg{max-width:100%;height:auto}
.bigmath{font-size:40px;text-align:center;margin:10px 0}
.part{margin-top:18px;border-top:3px dotted var(--line);padding-top:16px}
.ptitle{display:flex;gap:10px;align-items:center;font-size:24px;margin-bottom:12px}
.ptitle .say{width:48px;height:48px;font-size:21px}
.stepno{font-family:var(--f-display);background:var(--ink);color:#fff;border-radius:10px;padding:0 10px;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.opts.short{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}.opts.short .opt{min-height:64px;padding:8px 8px 8px 40px}
.opt{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px 12px;font-size:28px;min-height:76px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.opt:hover:not(:disabled){background:var(--hl);transform:translateY(-2px)}
.opt.txt{font-size:22px;padding-left:46px}
.eng{direction:ltr;unicode-bidi:isolate;font-family:'Varela Round',Arial,sans-serif}
.opt .eng{font-size:30px}.bigword{font-size:54px;line-height:1.25}.bigword .tr{display:block;font-size:22px;color:var(--muted);direction:rtl}
.spell{display:flex;flex-direction:column;align-items:center;gap:14px}
.slots{direction:ltr;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:72px}
.slot{width:58px;height:68px;border:3px dashed var(--muted);border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:40px;font-family:'Varela Round',Arial,sans-serif}
.slot.act{border:3px solid var(--accent);background:var(--hl)}.slots.good .slot{border:3px solid var(--good);background:var(--good-bg)}.slots.bad .slot{border:3px solid var(--bad);background:var(--bad-bg)}
.tiles2{direction:ltr;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ltile{width:62px;height:62px;border:3px solid var(--ink);border-radius:14px;background:var(--sun,#ffd84d);font-size:34px;font-family:'Varela Round',Arial,sans-serif;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.ltile:disabled{opacity:.3;box-shadow:none}
@media (max-width:640px){.slot{width:46px;height:56px;font-size:32px}.ltile{width:52px;height:52px;font-size:28px}.bigword{font-size:42px}}
.opt:disabled{cursor:default}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);opacity:.6;box-shadow:none}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 0 0 4px var(--good)}
/* board mechanics (sort / match / order / tap / cells). One colour = one meaning: items are neutral sand until they sit in a group, then take the group's colour.
   Look "kids" (default) or "teen" (calmer, flat) is set on <html data-look> from the pack's class. */
:root{--bd-sand:#f1e4c6;--bd-sandd:#cdb98a;--bd-off:#fff4dc;--bd-cut:#fffdf6;--bd-on:url(#bdck);
  --bd-k0:#d9c9ff;--bd-k0d:#a487ea;--bd-k1:#ffe08a;--bd-k1d:#d9b341;--bd-k2:#a9ecd0;--bd-k2d:#43b58a;--bd-k3:#bfe3ff;--bd-k3d:#5aa9e6;--bd-k4:#ffc9d6;--bd-k4d:#e0708f;--bd-k5:#ffd5b0;--bd-k5d:#e0914f;
  --bd-b0:#f1e9ff;--bd-b1:#fff3cf;--bd-b2:#dcf7ea;--bd-b3:#e3f3ff;--bd-b4:#ffe6ec;--bd-b5:#ffeedd}
html[data-look="teen"]{--bd-sandd:#c9bb98;--bd-off:#eef0f8;--bd-cut:#fff;--bd-on:#e3a54f}
.bd{display:grid;gap:14px;width:100%}
.opt.bd-chip{--cbg:var(--bd-sand);--cd:var(--bd-sandd);background:var(--cbg);border:0;border-radius:16px;box-shadow:0 5px 0 var(--cd);min-height:54px;font-size:22px;padding:8px 14px;flex:0 1 auto}
.opt.bd-chip:hover:not(:disabled){background:var(--cbg);transform:translateY(-2px)}
.bd-chip[data-k="0"]{--cbg:var(--bd-k0);--cd:var(--bd-k0d)}.bd-chip[data-k="1"]{--cbg:var(--bd-k1);--cd:var(--bd-k1d)}.bd-chip[data-k="2"]{--cbg:var(--bd-k2);--cd:var(--bd-k2d)}
.bd-chip[data-k="3"]{--cbg:var(--bd-k3);--cd:var(--bd-k3d)}.bd-chip[data-k="4"]{--cbg:var(--bd-k4);--cd:var(--bd-k4d)}.bd-chip[data-k="5"]{--cbg:var(--bd-k5);--cd:var(--bd-k5d)}
.opt.bd-chip.sel{background:var(--cbg);transform:translateY(-4px) scale(1.06);box-shadow:0 9px 0 var(--cd),0 0 0 4px var(--card),0 0 0 8px var(--accent)}
.opt.bd-chip.right{background:var(--cbg);opacity:1;box-shadow:0 5px 0 var(--cd),0 0 0 3px var(--good)}
.opt.bd-chip.wrong{background:var(--cbg);opacity:1;box-shadow:0 5px 0 var(--cd),0 0 0 3px var(--bad);animation:bdshake .4s}
.opt.bd-chip.miss{border:2px dashed var(--good)}
.opt.bd-chip.bd-empty{background:transparent;box-shadow:none;border:2px dashed var(--line);opacity:.6}
.bd-chip.right::after,.bd-chip.wrong::after,.bd-tok.right::after,.bd-tok.wrong::after{position:absolute;top:-9px;inset-inline-end:-9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 system-ui,sans-serif;color:#fff}
.bd-chip.right::after,.bd-tok.right::after{content:"✓";background:var(--good)}.bd-chip.wrong::after,.bd-tok.wrong::after{content:"✗";background:var(--bad)}
.bd-tray,.bd-chips,.bd-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bd-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bd-bin{--bbg:var(--card);border-radius:22px;padding:8px;min-height:96px;background:var(--bbg);border:0}
.bd-bin[data-k="0"]{--bbg:var(--bd-b0)}.bd-bin[data-k="1"]{--bbg:var(--bd-b1)}.bd-bin[data-k="2"]{--bbg:var(--bd-b2)}.bd-bin[data-k="3"]{--bbg:var(--bd-b3)}.bd-bin[data-k="4"]{--bbg:var(--bd-b4)}.bd-bin[data-k="5"]{--bbg:var(--bd-b5)}
.bd-binh{display:block;width:100%;font:inherit;font-family:var(--f-display);font-size:18px;background:var(--card);border:0;border-radius:999px;box-shadow:0 3px 0 rgba(27,42,74,.12);cursor:pointer;padding:6px 8px;color:inherit;margin-bottom:8px}
.bd-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bd-col{display:grid;gap:10px;align-content:start}
.bd-slot{min-width:64px}
.bd-tok{font:inherit;font-size:24px;background:var(--card);border:3px solid transparent;border-radius:12px;padding:6px 10px;cursor:pointer;color:inherit;position:relative}
.bd-tok:hover:not(:disabled){background:var(--hl)}.bd-tok.on{border-color:var(--accent);background:var(--hl)}
.bd-tok.right{background:var(--good-bg);border-color:var(--good)}.bd-tok.wrong{background:var(--bad-bg);border-color:var(--bad);animation:bdshake .4s}.bd-tok.miss{border:3px dashed var(--good)}
.bd-shape{width:150px;max-width:42vw;height:auto;overflow:visible;filter:drop-shadow(0 5px 0 rgba(27,42,74,.14))}
.bd-cell{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .18s}
.bd-cell .base{fill:var(--bd-off);stroke:var(--bd-cut);stroke-width:3.5;stroke-linejoin:round}
.bd-cell.on .base{fill:var(--bd-on)}
.bd-cell .tex{display:none;pointer-events:none;stroke:none}.bd-cell.on .tex{display:block}
.bd-cell:hover{transform:scale(1.025)}.bd-cell.on{transform:scale(1.045)}
.bd-shapes.bad .bd-cell.on .base{fill:var(--bad-bg);stroke:var(--bad)}.bd-shapes.bad .bd-cell.on .tex{display:none}
.bd-shapes.good .bd-cell.on{animation:bdpop .5s}
html[data-look="teen"] .bd-cell .tex{display:none!important}
html[data-look="teen"] .bd-shape{filter:none}
html[data-look="teen"] .opt.bd-chip{border-radius:11px;font-size:20px;box-shadow:0 2px 0 var(--cd)}
html[data-look="teen"] .opt.bd-chip.sel{transform:translateY(-3px);box-shadow:0 4px 0 var(--cd),0 0 0 3px var(--card),0 0 0 5px var(--accent)}
html[data-look="teen"] .opt.bd-chip.right{box-shadow:0 2px 0 var(--cd),0 0 0 3px var(--good)}
html[data-look="teen"] .opt.bd-chip.wrong{box-shadow:0 2px 0 var(--cd),0 0 0 3px var(--bad)}
html[data-look="teen"] .bd-bin{border-radius:14px}
html[data-look="teen"] .bd-binh{font-family:var(--f-body);font-size:16px;font-weight:700;box-shadow:none;border-radius:10px}
@keyframes bdshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bdpop{0%{transform:scale(1.045)}50%{transform:scale(1.12)}100%{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){.bd *{animation:none!important;transition:none!important}}
.opt .os{position:absolute;top:6px;left:8px;font-size:16px;opacity:.75;background:var(--sun);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--ink)}
.pad{display:grid;grid-template-columns:1fr;gap:12px;justify-items:center}
.display{direction:ltr;min-width:260px;font-size:44px;font-variant-numeric:tabular-nums;text-align:center;background:var(--note);border:3px solid var(--ink);border-radius:16px;padding:6px 18px;min-height:76px}
.display.wrong{border-color:var(--bad);background:var(--bad-bg)}
.display.right{border-color:var(--good);background:var(--good-bg)}
.chain{direction:ltr;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:40px;font-family:var(--f-display);background:var(--note);border:2px solid var(--note-line);border-radius:16px;padding:10px 14px;margin:0 auto 12px;max-width:640px}
.chain .cbx{min-width:86px;height:68px;padding:0 8px;font:inherit;font-size:38px;border:3px dashed var(--muted);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.chain .cgrp{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.scratch{margin:0 auto 12px;text-align:center}.scratch .sl{font-size:18px;color:var(--muted);margin:4px 0}.scratch .colgrid{--cw:44px}.scratch .cdig,.scratch .cres{font-size:30px;height:46px}
.chain .cbx.act{border:3px solid var(--accent);background:var(--hl)}.chain .cbx.good{border:3px solid var(--good);background:var(--good-bg)}.chain .cbx.bad{border:3px solid var(--bad);background:var(--bad-bg)}
@media (max-width:640px){.chain{font-size:30px;gap:6px}.chain .cbx{min-width:64px;height:54px;font-size:30px}}
.keys{direction:ltr;display:grid;grid-template-columns:repeat(5,72px);gap:10px}
.key{height:66px;border-radius:16px;border:3px solid var(--ink);background:var(--card);font-size:32px;font-family:var(--f-display);box-shadow:3px 3px 0 var(--ink)}
.key:hover{background:var(--hl)}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.key.ok{background:var(--good);color:#fff;grid-column:span 2}
.key.del{background:var(--paper)}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(255,122,26,.35)}
.hitline{stroke:transparent;stroke-width:26;cursor:pointer;stroke-linecap:round}
.hitline:hover{stroke:rgba(255,122,26,.35)}
.sl{fill:var(--card);stroke:var(--ink);stroke-width:2}
.sl.on{fill:var(--fill)}
.svgt{fill:var(--ink);font-family:var(--f-body)}

/* notebook */
.note{margin-top:18px;background:var(--note);border:2px solid var(--note-line);border-radius:12px;padding:10px 54px 14px 18px;position:relative;
  background-image:linear-gradient(transparent 45px,var(--note-line) 46px);background-size:100% 46px;background-position:0 38px}
.note::before{content:"";position:absolute;top:0;bottom:0;right:40px;width:2px;background:var(--margin)}
.note h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--muted);height:40px}
.nline{min-height:46px;line-height:46px;font-size:25px;animation:write .5s ease-out}
.nline .lbl{color:var(--muted);font-size:19px}
@keyframes write{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}

/* mascot bubble */
.coach{display:flex;gap:12px;align-items:flex-end;margin-top:16px}
.bubble{flex:1;min-width:0;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px 16px;font-size:23px;position:relative}
.bubble.good{background:var(--good-bg);border-color:var(--good)}
.bubble.hint{background:var(--hl)}
.actions{display:flex;gap:12px;justify-content:flex-start;flex-wrap:wrap;margin-top:16px}

/* explanation */
.explain{margin-top:18px;background:#f4f8ff;border:3px solid var(--ink);border-radius:20px;padding:16px}
.explain h3{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:25px}
.estep{display:flex;gap:12px;align-items:flex-start;font-size:24px;padding:8px 0;border-bottom:2px dashed var(--line);animation:fade .4s}
.estep b.n{font-family:var(--f-display);font-weight:400;background:var(--accent);color:#fff;border-radius:50%;min-width:38px;height:38px;display:grid;place-items:center;font-size:20px}
.estep .ev{margin-top:8px}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}}

/* ===== LOOK: the whole game, set on <html data-look="kids|teen"> (from the pack's class; see bdLookOf) =====
   Soft cards with a bottom edge instead of ink outlines; one primary colour (purple); sand options that take a colour only for meaning
   (green = right, red = wrong, with ✓/✗). "teen" is the same layout, calmer and flatter. Screen only: printing is untouched. */
@media screen{
html[data-look]{--accent:#7c4dff;--accent-dk:#4b2bb5;--ink:#33295c;--muted:#5d5a7a;--line:#d6d3e8;--edge:rgba(51,41,92,.14);--r-card:28px;--r-btn:999px;--r-opt:16px}

html[data-look] body{background:linear-gradient(180deg,#78c8ff,#eaf7ff 70%) fixed;background-size:auto}
html[data-look="teen"] body{background:linear-gradient(180deg,#dde5f4,#f2f5fb 70%) fixed}

  const c=fx,ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff7a1a','#ffd84d','#138a5c','#3b7dd8','#e0457b'];
  const P=Array.from({length:70},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:Math.random()*8+5,c:pick(cols),r:Math.random()*6}));
  let f=0;(function step(){ctx.clearRect(0,0,c.width,c.height);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()}
    if(++f<70)requestAnimationFrame(step);else ctx.clearRect(0,0,c.width,c.height)})();
}

let SS=null;
function startSession(mode,topic,list){
  let items=[],examId=null;
  if(mode=='exam'){examId=topic||1;items=examItems(examId);topic=null}
  else if(mode=='gen'){const g=topic;topic=TOPIC_OF[g];for(let i=0;i<6;i++)items.push({g})}
  else if(mode=='world'){const wk=weakGens().map(x=>x.g).filter(g=>TOPIC_OF[g]==topic);const gens=TOPIC_GENS[topic].concat(wk,wk);const sh=shuffle(gens);for(let i=0;i<10;i++)items.push({g:sh[i%sh.length]});items=shuffle(items)}
  else if(mode=='review') items=list;
  else if(mode=='sheet'){const sh=SHEETS.find(x=>x.id==topic);sh.sections.forEach((sec,si)=>sec.items.forEach((_,i)=>items.push({g:'sheetQ',p:{s:sh.id,sec:si,i}})))}
  else{ // mission: one per topic + 6 weighted to weak topics + recent mistakes
    const due=srsDue().slice(0,4);due.forEach(g=>items.push({g,rev:true}));
    const tps=shuffle(TOPICS.map(t=>t.id));tps.forEach(t=>items.push({g:pick(TOPIC_GENS[t])}));
    const recent=[...new Set(ST.mistakes.filter(m=>TOPIC_OF[m.gen]).slice(-6).map(m=>m.gen))].slice(0,3);recent.forEach(g=>items.push({g}));
    const foc=focusTopics();foc.forEach(t=>items.push({g:pick(TOPIC_GENS[t])}));
    while(items.length<12){const w=TOPICS.map(t=>({t:t.id,w:1+2*(1-acc(t.id))+(tstat(t.id).n<5?1:0)+(foc.includes(t.id)?4:0)}));let r=Math.random()*w.reduce((a,b)=>a+b.w,0);let ch=w[0].t;for(const x of w){r-=x.w;if(r<=0){ch=x.t;break}}items.push({g:pick(TOPIC_GENS[ch])})}
    items=shuffle(items.filter(x=>!x.rev)).slice(0,12-due.length);items=items.concat(due.map(g=>({g,rev:true})));items=shuffle(items);
  }
  SS={mode,topic,examId,genFocus:mode=='gen'?items[0].g:null,items,idx:0,results:[],starsAt:ST.stars,requeued:0};
  nextQ();
}

const SYNC={db:null,owner:false,status:'בודק חיבור…',chain:Promise.resolve()};

  try{

    SYNC.owner=user?await user.isOwner():false;
    if(!db){SYNC.status='לא זמין (צריך להיות מחובר ל-Claude)';return}

    SYNC.db=db;SYNC.status='פעיל';

  }catch(e){SYNC.status='לא זמין'}
})();
function syncOn(){return !!SYNC.db&&ST.settings.sync!==false}
function logAnswer(rec){

}

/* progress over time: accuracy from the first try in the first practice days vs the latest ones (needs enough data, otherwise says nothing) */
function trendLine(){
  const ts=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getTime()};
  const days=Object.entries(ST.daily||{}).filter(([,x])=>x&&x.n).sort((a,b)=>ts(a[0])-ts(b[0]));
  if(days.length<10)return '';
  const sum=a=>a.reduce((s,[,x])=>({n:s.n+x.n,f:s.f+x.first}),{n:0,f:0});
  const h=Math.min(7,Math.floor(days.length/2)),A=sum(days.slice(0,h)),B=sum(days.slice(-h));
  if(A.n<20||B.n<20)return '';
  const a=Math.round(A.f/A.n*100),b=Math.round(B.f/B.n*100),d=b-a;
  return `📈 מגמה: בימי התרגול הראשונים ${a}% נכון מהפעם הראשונה, ובאחרונים ${b}%${d>=5?' (שיפור)':d<=-5?' (ירידה, כדאי לבדוק מה קשה)':' (יציב)'}`}
function buildReport(){
  const days=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`)}
  const D=ST.daily||{};let n7=0,f7=0,act=0;days.forEach(k=>{if(D[k]&&D[k].n){act++;n7+=D[k].n;f7+=D[k].first}});
  const gs=Object.entries(ST.genStats||{}).filter(([g,x])=>x.n>=4&&GNAME[g]);
  const strong=gs.filter(([,x])=>x.first/x.n>=.8).sort((a,b)=>b[1].first/b[1].n-a[1].first/a[1].n).slice(0,4).map(([g])=>GNAME[g]);
  const weakL=weakGens().filter(x=>GNAME[x.g]).slice(0,4).map(x=>`${GNAME[x.g]} (${x.first} מתוך ${x.n})`);
  const mt=Object.entries(ST.mtypes||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k} (${v} פעמים)`);
  const ex=Object.entries(EXS()).map(([id,e])=>`מבחן ${id}: ${e.best}/${e.n}`);
  const exLv=Object.entries(ST.lvl||{}).filter(([,l])=>l>=3).length;
  const L=[`📊 דוח התקדמות – ${kid()||'הילד'} | מסע הלמידה, ${SUBJECT_NAME}`,
    `📅 שבוע אחרון: ${act} ימי תרגול, ${n7} שאלות${n7?`, ${Math.round(f7/n7*100)}% נכון מהפעם הראשונה`:''}`,
    `💪 חזק ב: ${strong.length?strong.join(', '):'עוד אין מספיק נתונים'}`,
    `🎯 צריך חיזוק ב: ${weakL.length?weakL.join(', '):'אין כרגע נושא בולט'}`];
  const tr=trendLine();if(tr)L.push(tr);
  if(mt.length)L.push(`⚠️ טעויות שחוזרות: ${mt.join('; ')}`);
  if(exLv)L.push(`🚀 ${exLv} סוגי שאלות כבר ברמת מבחן`);
  if(ex.length)L.push(`📝 ${ex.join(' · ')}`);
  const due=Object.keys(ST.srs||{}).filter(g=>TOPIC_OF[g]&&GNAME[g]);if(due.length)L.push(`🔁 בחזרה מרווחת: ${due.map(g=>GNAME[g]).slice(0,5).join(', ')}`);
  L.push(`⭐ ${ST.stars} כוכבים`);
  return L.join('\n');
}

      const idx=pool.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
      for(let k=0;k<s.n;k++)out.push({g:'pk_'+s.skill,p:{ix:idx[k%idx.length],paper:true},seed:id*1009+si*97+k*31+1,lab:(s.label||'שאלה {n}').replace('{n}',k+1)})});
    return out};
  SHEETS.splice(0,SHEETS.length,...(P.sheets||[]).map(sh=>({id:sh.id,name:sh.name,sub:sh.sub||'',sections:sh.sections.map(sec=>({...sec,items:sec.items.map(r=>({pool:r.pool||sec.pool,id:r.id??r}))})),print(){return pkSheetPrint(sh)}})));
  G.sheetQ=(p={})=>{const sh=SHEETS.find(x=>x.id==p.s),sec=sh.sections[p.sec],r=sec.items[p.i];const sk=Object.values(PK.skills).find(k=>k.pool==r.pool);
    return pkQuestion(sk?sk.id:Object.keys(PK.skills)[0],{item:pkItem(r.pool,r.id)})};
  if(P.cfg)Object.assign(CFG,P.cfg);
  setLook(P);
  /* progress from older question names carries over (e.g. a hand-coded unit that became a pack) */
  for(const [old,sk] of Object.entries(P.legacy||{})){const g='pk_'+sk;for(const key of ['genStats','lvl','gStreak','srs']){const o=ST[key];if(o&&o[old]!=null&&o[g]==null)o[g]=o[old]}}
  if(ex[0])CFG.origName=ex[0].name;if(ex[1])CFG.variantName=ex[1].name;
}
/* validator (used by the build and, later, for AI-made packs): returns a list of problems */
function validatePack(P){pkNormalize(P);const errs=[];const E=m=>errs.push(m);
  if(P.schema!='masa-pack/1')E('schema');
  if(P.cfg&&P.cfg.look&&!['kids','teen'].includes(P.cfg.look))E('cfg.look must be kids or teen');const pools=P.pools||{};
  (P.topics||[]).forEach(t=>(t.skills||[]).forEach(s=>{if(!pools[s.pool]||!pools[s.pool].length)E(`skill ${s.id}: empty pool ${s.pool}`)}));
  for(const [pn,items] of Object.entries(pools))items.forEach((it,i)=>{const w=`${pn}[${it.id??i}]`;
    for(let r=0;r<(it.vars?30:1);r++){let V;try{V=pkVars(it.vars)}catch(e){E(w+' vars: '+e.message);break}
      const parts=it.type=='multi'?it.parts:[it];
      for(const pt of parts){if(!['choice','number','fraction','spell',...BOARD_TYPES].includes(pt.type)){E(w+' type '+pt.type);continue}
        if(BOARD_TYPES.includes(pt.type)){boardValidate(pt,V,w,E);continue}
        if(pt.answer==null&&!(pt.type=='number'&&pt.accept))E(w+' no answer');
        if(pt.type=='choice'){const vals=(pt.options||[]).map(x=>String(pkSub(typeof x=='string'?x:x.v,V)));const a=String(pkSub(pt.answer,V));
          if(!vals.includes(a))E(`${w}: answer "${a}" not in options`);if(new Set(vals).size!=vals.length)E(w+': duplicate options')}
        if(pt.type=='number'){try{const a=pt.answer!=null?pkCalc(String(pkSub(pt.answer,V)).replace(/^=/,''),V):null;if(a!=null&&!isFinite(a))E(w+' answer not a number')}catch(e){E(w+' answer: '+e.message)}}
        if(pt.type=='spell'&&!/^[A-Za-z]+$/.test(pkSub(pt.answer,V)))E(w+': spell answer must be letters')}}});
  (P.exams||[]).forEach((e,i)=>{(e.fixed||[]).forEach(f=>{if(!(P.topics||[]).some(t=>(t.skills||[]).some(s=>s.id==f.skill)))E(`exam ${i+1}: unknown skill ${f.skill}`)})});
  return errs}
/* ================= BOARD MECHANICS (subject-independent) =================
   The child does something with the items; the result is turned into ONE canonical string, so hints, mistakes,
   step-by-step explanations, levels and exams work exactly as for every other question type.
   Nothing here knows the subject: the content (text, numbers, words) comes from the pack.
     sort   items go into groups            { bins:["a","b"], items:[{t:"x",bin:0|"a"}] }
     match  pair left with right            { pairs:[{l:"x",r:"y"}] }
     order  put in order (listed correctly) { items:["first","second",…] }
     tap    tap the right words             { tokens:["The",{t:"cat",ok:true},"runs"] }
     cells  colour parts of a shape         { shape:"pie|bar", parts:4, wholes:1, count:3 }
   (synced into math-journey.html by sync_engine.py, together with pack-engine.js)                                  */
const BOARD_TYPES=['sort','match','order','tap','cells'];
/* the look (kids/teen) comes from the pack's class: see bdLookOf */
const BD_SAY={sort:'לחצו על פריט ואז על הקבוצה שלו.',match:'לחצו על פריט בצד אחד ואז על הפריט שמתאים לו.',order:'לחצו על הפריטים לפי הסדר.',tap:'לחצו על המילים הנכונות.',cells:'לחצו על החלקים כדי לצבוע אותם.'};
const bdMixed=n=>{const idx=[...Array(n).keys()];let d=shuffle(idx.slice());for(let k=0;k<6&&n>1&&d.every((x,i)=>x==i);k++)d=shuffle(idx.slice());return d};
/* one pack item → one engine part (kind 'board') */
function boardPart(it,V,base,prompt){
  const T=x=>pkHtml(x,V),mode=it.type;let d,answer;
  if(mode=='sort'){const bins=it.bins.map(T);
    const items=it.items.map(x=>({h:T(x.t),b:typeof x.bin=='number'?x.bin:it.bins.findIndex(b=>String(pkSub(b,V))==String(pkSub(x.bin,V)))}));
    d={bins,items,disp:bdMixed(items.length)};answer=items.map(x=>x.b).join(',')}
  else if(mode=='match'){d={L:it.pairs.map(x=>T(x.l)),R:it.pairs.map(x=>T(x.r)),disp:bdMixed(it.pairs.length)};answer=it.pairs.map((_,i)=>i).join(',')}
  else if(mode=='order'){d={items:it.items.map(T),disp:bdMixed(it.items.length)};answer=it.items.map((_,i)=>i).join(',')}
  else if(mode=='tap'){const tk=it.tokens.map(x=>typeof x=='string'?{t:x}:x);d={tokens:tk.map(x=>T(x.t)),ok:tk.map(x=>!!x.ok),ltr:!/[֐-׿]/.test(tk.map(x=>x.t).join(''))};answer=tk.map((x,i)=>x.ok?i:-1).filter(i=>i>=0).join(',')}
  else{const parts=+pkSub(it.parts,V),wholes=+pkSub(it.wholes??1,V),count=+pkSub(it.count,V);d={shape:it.shape||'pie',parts,wholes,count};answer=String(count)}
  return {...base,kind:'board',mode,prompt,d,answer:String(answer)}}
function boardState(pt){const d=pt.d;
  if(pt.mode=='sort')return {place:d.items.map(()=>-1),sel:null};
  if(pt.mode=='match')return {pair:d.L.map(()=>-1),selL:null,selR:null};
  if(pt.mode=='order')return {seq:[]};
  if(pt.mode=='tap')return {on:d.tokens.map(()=>false)};
  return {on:[...Array(d.parts*d.wholes)].map(()=>false)}}
function boardHtml(pt){return `<div class="bd bd-${pt.mode}" id="bdZone"></div><div class="actions" style="justify-content:center"><button class="big" id="bdOk">בדיקה ✓</button></div>`}
function boardInit(pt){SS.bd=boardState(pt);const z=view.querySelector('#bdZone');
  const act=el=>{const b=el.closest('[data-a]');if(b&&!SS.locked&&!SS.bd.done&&!b.disabled)boardAct(pt,b.dataset.a,+b.dataset.i)};
  z.addEventListener('click',e=>act(e.target));
  z.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('svg [data-a]')){e.preventDefault();act(e.target)}});
  view.querySelector('#bdOk').onclick=()=>boardCheck(pt);boardRender()}
function boardAct(pt,a,i){const st=SS.bd;st.flag=null;st.bad=false;const prev=pt.mode=='sort'?bdRects():null;
  if(a=='chip'){if(st.place[i]>=0){st.place[i]=-1;st.sel=null}else st.sel=st.sel==i?null:i}
  else if(a=='bin'){if(st.sel!=null){st.place[st.sel]=i;st.sel=null}}
  else if(a=='L'){if(st.pair[i]>=0){st.pair[i]=-1;st.selL=null}else st.selL=st.selL==i?null:i}
  else if(a=='R'){const k=st.pair.indexOf(i);if(k>=0){st.pair[k]=-1;st.selR=null}else st.selR=st.selR==i?null:i}
  else if(a=='pick')st.seq.push(i);
  else if(a=='slot')st.seq.splice(i,1);
  else if(a=='tok'||a=='cell')st.on[i]=!st.on[i];
  if(pt.mode=='match'&&st.selL!=null&&st.selR!=null){st.pair[st.selL]=st.selR;st.selL=st.selR=null}
  boardRender(prev)}
/* what the child built, as the same string as pt.answer; null while it is incomplete */
function boardCanon(pt){const st=SS.bd;
  if(pt.mode=='sort')return st.place.every(x=>x>=0)?st.place.join(','):null;
  if(pt.mode=='match')return st.pair.every(x=>x>=0)?st.pair.join(','):null;
  if(pt.mode=='order')return st.seq.length==pt.d.items.length?st.seq.join(','):null;
  if(pt.mode=='tap')return st.on.some(Boolean)?st.on.map((x,i)=>x?i:-1).filter(i=>i>=0).join(','):null;
  return st.on.some(Boolean)?String(st.on.filter(Boolean).length):null}
function boardCheck(pt){if(SS.locked||SS.bd.done)return;const v=boardCanon(pt);
  if(v==null){coach({sort:'עוד לא מיינת את כל הפריטים.',match:'עוד לא חיברת את כל הזוגות.',order:'עוד לא סידרת את כל הפריטים.',tap:'עוד לא סימנת אף מילה.',cells:'עוד לא צבעת אף חלק.'}[pt.mode],'hint','think');return}
  answer(v,null)}
function boardFlags(pt){const st=SS.bd,d=pt.d,f={};
  if(pt.mode=='sort')d.items.forEach((x,i)=>f[i]=st.place[i]==x.b?'right':'wrong');
  if(pt.mode=='match')st.pair.forEach((r,i)=>f[i]=r==i?'right':'wrong');
  if(pt.mode=='order')st.seq.forEach((x,k)=>f[k]=x==k?'right':'wrong');
  if(pt.mode=='tap')d.ok.forEach((ok,i)=>{if(st.on[i])f[i]=ok?'right':'wrong';else if(ok)f[i]='miss'});
  return f}
/* wrong answer: show what is right and what is not, then take back only the wrong pieces */
function boardWrong(pt){const st=SS.bd;st.flag=boardFlags(pt);if(pt.mode=='cells')st.bad=true;boardRender();
  setTimeout(()=>{if(SS.locked||SS.bd!==st||!view.querySelector('#bdZone'))return;const f=st.flag||{};st.flag=null;st.bad=false;
    if(pt.mode=='sort')pt.d.items.forEach((_,i)=>{if(f[i]=='wrong')st.place[i]=-1});
    if(pt.mode=='match')st.pair.forEach((_,i)=>{if(f[i]=='wrong')st.pair[i]=-1});
    if(pt.mode=='order'){const k=st.seq.findIndex((_,i)=>f[i]=='wrong');if(k>=0)st.seq.length=k}
    if(pt.mode=='tap')st.on.forEach((_,i)=>{if(f[i]=='wrong')st.on[i]=false});
    if(pt.mode=='cells')st.on=st.on.map(()=>false);
    st.sel=st.selL=st.selR=null;boardRender()},1100)}
/* right answer (or after the step-by-step explanation): show the finished board */
function boardRight(pt){const st=SS.bd,d=pt.d;if(!st)return;st.done=true;st.flag={};st.bad=false;
  if(pt.mode=='sort'){st.place=d.items.map(x=>x.b);d.items.forEach((_,i)=>st.flag[i]='right')}
  if(pt.mode=='match'){st.pair=d.L.map((_,i)=>i);d.L.forEach((_,i)=>st.flag[i]='right')}
  if(pt.mode=='order'){st.seq=d.items.map((_,i)=>i);d.items.forEach((_,i)=>st.flag[i]='right')}
  if(pt.mode=='tap'){st.on=d.ok.slice();d.ok.forEach((ok,i)=>{if(ok)st.flag[i]='right'})}
  if(pt.mode=='cells'){st.on=st.on.map((_,i)=>i<d.count);st.good=true}
  st.sel=st.selL=st.selR=null;boardRender()}
/* the answer as text (used by the explanation) */
function boardAns(pt){const d=pt.d;
  if(pt.mode=='sort')return d.bins.map((b,bi)=>`<b>${b}</b>: ${d.items.filter(x=>x.b==bi).map(x=>x.h).join(', ')}`).join('<br>');
  if(pt.mode=='match')return d.L.map((l,i)=>`${l} ↔ ${d.R[i]}`).join('<br>');
  if(pt.mode=='order')return d.items.join(' ← ');
  if(pt.mode=='tap')return d.tokens.filter((_,i)=>d.ok[i]).join(', ');
  return `${d.count} מתוך ${d.parts*d.wholes} חלקים`}
/* look: "kids" (default) or "teen", from the pack's class (subject.grade) or cfg.look. Colour keeps ONE meaning: the colour of a group. */
function bdLookOf(P){const c=P&&P.cfg&&P.cfg.look;if(c=='kids'||c=='teen')return c;
  const g=String((P&&P.subject&&P.subject.grade)||'').replace(/[׳'"״\s]/g,'');
  const n=parseInt(g,10);if(!isNaN(n))return n<=6?'kids':'teen';
  return ['א','ב','ג','ד','ה','ו'].includes(g)||!g?'kids':'teen'}
function setLook(P){document.documentElement.dataset.look=bdLookOf(P)}
/* shapes for 'cells' (pie or bar, one per whole). Kids get a cookie, teens a flat colour. */
function bdShape(d,on,bad,locked,w0){const W=120,bar=d.shape=='bar';let out='';
  for(let w=0;w<d.wholes;w++){let s=`<svg class="bd-shape" viewBox="0 0 ${bar?W*1.6:W} ${bar?44:W}" role="group" aria-label="שלם ${w+1} מתוך ${d.wholes}, מחולק ל-${d.parts} חלקים שווים">`;
    if(w==0)s+=`<defs><radialGradient id="bdck" cx="38%" cy="32%" r="80%"><stop offset="0" stop-color="#f0bd78"/><stop offset=".7" stop-color="#d9984f"/><stop offset="1" stop-color="#b9743a"/></radialGradient>
      <pattern id="bdchips" width="120" height="120" patternUnits="userSpaceOnUse">${[[30,24,4],[78,18,3.5],[96,50,4],[58,44,3],[22,68,3.5],[70,76,4],[102,92,3.5],[40,100,4],[14,100,3],[150,20,4],[170,30,3.5]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.8}" fill="#4a2a1a" transform="rotate(${x*3} ${x} ${y})"/>`).join('')}</pattern></defs>`;
    for(let k=0;k<d.parts;k++){const i=w*d.parts+k;
      const attr=`class="bd-cell${on[i]?' on':''}" data-a="cell" data-i="${i}" ${locked?'':'tabindex="0"'} role="button" aria-pressed="${!!on[i]}" aria-label="חלק ${k+1}"`;
      let geo;
      if(bar){const cw=W*1.6/d.parts;geo=(extra)=>`<rect ${extra} x="${k*cw+1}" y="2" width="${cw-2}" height="40" rx="4"/>`}
      else{const a=k*2*Math.PI/d.parts-Math.PI/2,b=(k+1)*2*Math.PI/d.parts-Math.PI/2,r=56,dd=`M60 60 L${(60+r*Math.cos(a)).toFixed(2)} ${(60+r*Math.sin(a)).toFixed(2)} A${r} ${r} 0 0 1 ${(60+r*Math.cos(b)).toFixed(2)} ${(60+r*Math.sin(b)).toFixed(2)} Z`;geo=(extra)=>`<path ${extra} d="${dd}"/>`}
      s+=`<g ${attr}>${geo('class="base"')}${geo('class="tex" fill="url(#bdchips)"')}</g>`}
    out+=s+'</svg>'}
  return out}
const bdReduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const bdRects=()=>{const m={};document.querySelectorAll('#bdZone .bd-chip[data-i]').forEach(c=>m[c.dataset.i]=c.getBoundingClientRect());return m};
function bdFlip(prev){if(!prev||bdReduce())return;const teen=document.documentElement.dataset.look=='teen';
  document.querySelectorAll('#bdZone .bd-chip[data-i]').forEach(c=>{const a=prev[c.dataset.i];if(!a)return;const b=c.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(Math.abs(dx)+Math.abs(dy)>2)c.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:teen?180:300,easing:teen?'ease-out':'cubic-bezier(.2,.9,.3,1.2)'})})}
function boardRender(prev){const pt=SS.q.parts[SS.part],z=view.querySelector('#bdZone');if(!z)return;
  const st=SS.bd,d=pt.d,f=st.flag||{},lock=st.done?' disabled':'';
  const chip=(a,i,h,extra='',k)=>`<button class="opt txt bd-chip ${extra} ${f[i]||''}" data-a="${a}" data-i="${i}" data-k="${k==null||k<0?'':k%6}"${lock}>${h}</button>`;
  let h='';
  if(pt.mode=='sort')
    h=`<div class="bd-bins">${d.bins.map((b,bi)=>`<div class="bd-bin" data-k="${bi%6}"><button class="bd-binh" data-a="bin" data-i="${bi}"${lock}>${b}</button><div class="bd-chips">${d.items.map((x,i)=>st.place[i]==bi?chip('chip',i,x.h,'',bi):'').join('')}</div></div>`).join('')}</div>
      <div class="bd-tray">${d.disp.filter(i=>st.place[i]<0).map(i=>chip('chip',i,d.items[i].h,st.sel==i?'sel':'')).join('')}</div>`;
  if(pt.mode=='match'){const used=j=>st.pair.indexOf(j);
    h=`<div class="bd-cols"><div class="bd-col">${d.L.map((x,i)=>chip('L',i,x,st.selL==i?'sel':'',st.pair[i]>=0?i:-1)).join('')}</div>
      <div class="bd-col">${d.disp.map(j=>chip('R',j,d.R[j],st.selR==j?'sel':'',used(j)>=0?used(j):-1)).join('')}</div></div>`}
  if(pt.mode=='order')
    h=`<div class="bd-row">${d.items.map((_,k)=>st.seq[k]!=null?chip('slot',k,d.items[st.seq[k]],'bd-slot'):`<span class="opt txt bd-chip bd-slot bd-empty">${k+1}</span>`).join('')}</div>
      <div class="bd-tray">${d.disp.filter(i=>!st.seq.includes(i)).map(i=>chip('pick',i,d.items[i])).join('')}</div>`;
  if(pt.mode=='tap')
    h=`<div class="bd-row bd-text" dir="${d.ltr?'ltr':'rtl'}">${d.tokens.map((t,i)=>`<button class="bd-tok ${st.on[i]?'on':''} ${f[i]||''}" data-a="tok" data-i="${i}" aria-pressed="${!!st.on[i]}"${lock}>${t}</button>`).join(' ')}</div>`;
  if(pt.mode=='cells')
    h=`<div class="bd-row bd-shapes ${st.bad?'bad':''} ${st.good?'good':''}">${bdShape(d,st.on,st.bad,st.done)}</div><div class="flabels" style="text-align:center">${st.on.filter(Boolean).length} חלקים צבועים</div>`;
  z.innerHTML=h;bdFlip(prev)}
/* validator part (called from validatePack for every board item, once per random draw of its variables) */
function boardValidate(pt,V,w,E){const sub=x=>pkSub(x,V);const uniq=a=>new Set(a.map(x=>String(sub(x)))).size==a.length;
  if(pt.type=='sort'){if(!Array.isArray(pt.bins)||pt.bins.length<2||!Array.isArray(pt.items)||pt.items.length<2)return E(w+': sort needs 2+ bins and 2+ items');
    if(!uniq(pt.bins))E(w+': duplicate bins');
    pt.items.forEach(x=>{const b=typeof x.bin=='number'?x.bin:pt.bins.findIndex(y=>String(sub(y))==String(sub(x.bin)));if(!(b>=0&&b<pt.bins.length))E(`${w}: item "${x.t}" has no valid bin`)});
    if(!uniq(pt.items.map(x=>x.t)))E(w+': duplicate items')}
  if(pt.type=='match'){if(!Array.isArray(pt.pairs)||pt.pairs.length<2)return E(w+': match needs 2+ pairs');
    if(!uniq(pt.pairs.map(x=>x.l))||!uniq(pt.pairs.map(x=>x.r)))E(w+': duplicate side in pairs')}
  if(pt.type=='order'){if(!Array.isArray(pt.items)||pt.items.length<2)return E(w+': order needs 2+ items');if(!uniq(pt.items))E(w+': duplicate items')}
  if(pt.type=='tap'){if(!Array.isArray(pt.tokens)||pt.tokens.length<2)return E(w+': tap needs tokens');if(!pt.tokens.some(x=>x&&x.ok))E(w+': tap needs at least one {ok:true} token')}
  if(pt.type=='cells'){const p=+sub(pt.parts),wh=+sub(pt.wholes??1),c=+sub(pt.count);
    if(!Number.isInteger(p)||p<2||p>12)E(w+': cells parts must be 2..12');
    if(!Number.isInteger(wh)||wh<1||wh>6)E(w+': cells wholes must be 1..6');
    if(!Number.isInteger(c)||c<1||c>p*wh)E(w+': cells count must be 1..parts*wholes (got '+sub(pt.count)+')');
    if(pt.shape&&!['pie','bar'].includes(pt.shape))E(w+': cells shape must be pie or bar')}}
/*SUBJECT-PACK*/
startApp();
